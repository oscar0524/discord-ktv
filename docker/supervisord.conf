; all-in-one 映像的 process 管理：同時啟動 redis、api、discord-bot。
; web 產物由 api 以 Express static 提供，因此不需獨立 web process。
[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0

[program:redis]
command=redis-server --save "" --appendonly no
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
command=node /app/api/main.js
environment=REDIS_URL="redis://127.0.0.1:6379",API_PORT="3333"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:discord-bot]
command=node /app/discord-bot/main.js
environment=REDIS_URL="redis://127.0.0.1:6379"
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
