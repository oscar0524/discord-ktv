# 開發環境：redis + discord-bot + api + web 四個獨立 service。
# 原始碼以 volume 掛載，node_modules 用具名 volume 保留容器內安裝結果。
#
# 使用方式（在專案根目錄）：
#   cp .env.example .env   # 填入 DISCORD_TOKEN 等
#   docker compose -f docker/docker-compose.yml up
#
# 前端：http://localhost:4200   API：http://localhost:3333
name: discord-ktv-dev

services:
  redis:
    image: redis:7-alpine
    # 開啟 AOF 持久化，讓 Discord 設定 (ktv:config:discord) 跨重啟保存
    command: redis-server --appendonly yes --dir /data
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  discord-bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    command: npm run serve:bot
    working_dir: /workspace
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      # env_file (../.env) 提供 DISCORD_TOKEN / DISCORD_KTV_CHANNEL_ID；
      # 此處只覆寫容器內連線用的 REDIS_URL。
      - REDIS_URL=redis://redis:6379
    volumes:
      - ..:/workspace
      - bot_node_modules:/workspace/node_modules

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    command: npm run serve:api
    working_dir: /workspace
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - API_PORT=3333
      # 開發時前端在瀏覽器以 http://localhost:4200 打 API，需放行此來源
      - CORS_ORIGIN=http://localhost:4200
    ports:
      - '3333:3333'
    volumes:
      - ..:/workspace
      - api_node_modules:/workspace/node_modules

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    command: npm run serve:web
    working_dir: /workspace
    depends_on:
      - api
    environment:
      - WEB_PORT=4200
      - VITE_API_URL=http://localhost:3333
      - VITE_WS_URL=ws://localhost:3333
    ports:
      - '4200:4200'
    volumes:
      - ..:/workspace
      - web_node_modules:/workspace/node_modules

volumes:
  bot_node_modules:
  api_node_modules:
  web_node_modules:
  redis_data:
